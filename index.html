<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    /* Body styling */
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    /* Game title */
    h1 {
      color: #333;
      margin-top: 20px;
    }

    /* Canvas styling */
    canvas {
      border: 2px solid black;
      background-color: #000;
      display: block;
      margin: 20px auto;
    }

    /* Instructions */
    p {
      font-size: 16px;
      color: #555;
      margin: 5px;
    }

    /* Score display */
    #score {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      color: #222;
    }
  </style>
</head>
<body>
  <h1>Snake Game</h1>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <p>Use arrow keys to move.</p>
  <p>Press 5 to pause/resume, 0 to restart.</p>
  <p id="score">Score: 0</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CELL_SIZE = 20;
    const COLS = canvas.width / CELL_SIZE;
    const ROWS = canvas.height / CELL_SIZE;

    let snake = [];
    let direction;
    let food;
    let gameOver = false;
    let paused = false;

    function resetGame() {
      snake = [{x: 5, y: 5}];
      direction = "right";
      food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      gameOver = false;
      paused = false;
      updateScore(0);
    }

    resetGame();

    document.addEventListener('keydown', (e) => {
      if (e.key === "ArrowUp" && direction !== "down") direction = "up";
      if (e.key === "ArrowDown" && direction !== "up") direction = "down";
      if (e.key === "ArrowLeft" && direction !== "right") direction = "left";
      if (e.key === "ArrowRight" && direction !== "left") direction = "right";

      if (e.key === "5") paused = !paused;
      if (e.key === "0") resetGame();
    });

    function updateScore(value) {
      document.getElementById("score").innerText = "Score: " + value;
    }

    function update() {
      if (gameOver) {
        resetGame();
        return;
      }
      if (paused) return;

      let head = {...snake[snake.length - 1]};

      if (direction === "up") head.y--;
      if (direction === "down") head.y++;
      if (direction === "left") head.x--;
      if (direction === "right") head.x++;

      // Collision detection
      if (snake.some(seg => seg.x === head.x && seg.y === head.y) || head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver = true;
        return;
      }

      snake.push(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      } else {
        snake.shift();
      }

      updateScore(snake.length - 1);
      draw();
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "green";
      snake.forEach(seg => ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE, CELL_SIZE));

      ctx.fillStyle = "red";
      ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    }

    setInterval(update, 200);
  </script>
</body>
</html>
